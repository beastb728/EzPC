<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC Build Agent · EthPC</title>
<meta name="description" content="An AI agent that shops for your gaming PC and only spends what you approve.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e6e8ec;--line2:#d0d5dd;--ink:#101828;--ink2:#344054;--mut:#667085;--faint:#98a2b3;
  --blue:#2f5be7;--blue-h:#2449c9;--blue-w:#eef2fe;--blue-s:#a9bdf6;--green:#15803d;--green-w:#e8f6ed;--amber:#b54708;--amber-w:#fef4e6;--red:#d92d20;--red-w:#fef0ee;
  --paper:#f3eee3;--sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
.mono{font-family:var(--mono);font-size:.88em;overflow-wrap:anywhere}.mut{color:var(--mut)}.sm{font-size:13px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;letter-spacing:-.01em}

button{font:600 13.5px/1 var(--sans);padding:10px 14px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s}
button:hover:not(:disabled){background:var(--blue-h);border-color:var(--blue-h)}button:disabled{background:var(--blue-s);border-color:var(--blue-s);cursor:default}
button.ghost{background:#fff;color:var(--ink2);border-color:var(--line2)}button.ghost:hover:not(:disabled){background:var(--bg);border-color:var(--faint)}button.ghost:disabled{color:var(--faint);background:#fff;border-color:var(--line)}
button.small{padding:6px 10px;font-size:12.5px;font-weight:500}
.link,.textbtn{background:none;border:0;color:var(--mut);padding:4px 2px;font:500 13px var(--sans)}.link:hover:not(:disabled),.textbtn:hover:not(:disabled){background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.textbtn{color:var(--blue);padding:0}.textbtn:hover:not(:disabled){color:var(--blue-h)}.textbtn:disabled{background:none;color:var(--mut)}
textarea,input[type=number],input[type=text],select{font:14px/1.5 var(--sans);color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:6px;padding:8px 10px}
textarea{width:100%;min-height:84px;resize:vertical}input[type=number]{width:130px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-w)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.err{color:var(--red);font-size:13px;margin:8px 0 0;overflow-wrap:anywhere}.err:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:4px;padding:2px 7px;background:var(--bg);color:var(--mut);white-space:nowrap}
.pill.ok{background:var(--green-w);color:var(--green)}.pill.ask{background:var(--amber-w);color:var(--amber)}.pill.no{background:var(--red-w);color:var(--red)}.pill.blue{background:var(--blue-w);color:var(--blue)}
.ico{display:inline-block;vertical-align:middle;flex:none}

body.landing{background:var(--paper)}
.lnav{max-width:1180px;margin:0 auto;padding:22px 24px;display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.lnav .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.lnav .right #login{display:inline-flex;align-items:center;gap:12px;margin-right:6px}
.lnav .right .link{color:var(--ink);font-weight:600;font-size:13.5px;line-height:1;padding:6px 2px}
.lnav .right #logout{color:var(--mut);font-weight:500;border-left:1px solid var(--line2);padding:4px 0 4px 12px;border-radius:0}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}.logo:hover{text-decoration:none}
.logo svg{color:var(--blue)}
.lhero{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:40px 24px 0;text-align:center}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.lhero h1{font-size:clamp(34px,5.2vw,52px);line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:14px auto 16px;max-width:15ch;text-wrap:balance}
.lhero .sub{font-size:15.5px;color:var(--mut);margin:0 auto 26px;max-width:46ch}
.promptbox{max-width:600px;margin:0 auto;text-align:left;background:color-mix(in srgb,#fff 72%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgb(255 255 255 / .9);border-radius:20px;padding:14px 14px 12px 18px;box-shadow:0 10px 40px rgb(80 60 20 / .10),0 0 0 1px rgb(120 100 60 / .08)}
.promptbox:focus-within{box-shadow:0 10px 40px rgb(80 60 20 / .12),0 0 0 3px var(--blue-w),0 0 0 1px var(--blue)}
.promptbox textarea{border:0;background:transparent;padding:4px 0;min-height:76px;font-size:15.5px;font-weight:500;color:var(--blue);resize:none;box-shadow:none}
.promptbox textarea::placeholder{color:color-mix(in srgb,var(--blue) 55%,#fff)}
.promptbox .row{justify-content:space-between;margin-top:6px}.promptbox .hint{font-size:12px;color:var(--mut)}
.promptbox button{border-radius:999px;padding:11px 20px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.examples{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:760px;margin:18px auto 0}
.examples button{display:inline-flex;align-items:center;gap:6px;background:rgb(40 44 52 / .78);border:0;color:#fff;font-size:11.5px;font-weight:500;padding:7px 12px;border-radius:999px;white-space:normal;text-align:left;backdrop-filter:blur(4px)}
.examples button:hover:not(:disabled){background:rgb(20 24 32 / .9)}
.fine{font-size:12px;color:var(--mut);margin:22px auto 0;max-width:56ch}
.scene{position:relative;z-index:1;display:block;width:100%;height:auto;margin-top:-20px;pointer-events:none}
.lfoot{background:#e7dcc6;height:28px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.side .logo{padding:0 8px 22px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--ink2);font-weight:500;font-size:14px;text-decoration:none}
.nav a:hover{background:var(--bg);text-decoration:none}.nav a.on{background:var(--blue-w);color:var(--blue)}.nav a .ico{color:var(--mut)}.nav a.on .ico{color:var(--blue)}
.cards{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:24px}
.mini{border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12.5px;background:var(--card)}
.mini .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mini .lb{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);line-height:1.4}
.mini .auth{font-size:11.5px;font-weight:600;color:var(--green);text-align:right;line-height:1.3}
.mini .big{font-size:17px;font-weight:700;color:var(--blue);margin-top:6px;line-height:1.25}.mini .big small{font-size:13px;font-weight:600}
.mini .big.none{color:var(--faint)}
.bar{height:5px;border-radius:9px;background:var(--bg);overflow:hidden;margin:8px 0 6px}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .5s}
.mini .row{margin-top:8px}
.acct{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:#7b8494;color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
img.avatar{object-fit:cover;background:var(--bg)}.who-mini{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink)}.who-mini .avatar{width:26px;height:26px;font-size:12px}
.acct b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct .via{font-size:11.5px;color:var(--mut);display:block}
.mini hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.wline{display:flex;align-items:center;gap:6px;font-size:12.5px}.wline b{font-weight:600}.wline .link{margin-left:auto;font-size:12px;padding:0}
.bal{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.bal span{font-size:12px;font-weight:600;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 7px}
.side .reset{align-self:flex-start;margin:10px 0 0 4px;font-size:12px}
.work{min-width:0;display:flex;flex-direction:column}
.work-head{background:var(--card);border-bottom:1px solid var(--line);padding:16px 32px;min-height:64px;display:flex;align-items:center;gap:16px}
.work-head h1{font-size:16px;font-weight:600}.work-head p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.work-head .status{margin-left:auto;display:flex;align-items:center;gap:8px}
.work-body{padding:32px 32px 72px;max-width:900px;width:100%}
.title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.lead{color:var(--mut);margin:0 0 24px;max-width:66ch}

.sec{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sec-h b{font-size:15px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink)}
.sec-h a,.sec-h .textbtn{font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:500}
.sec-b{padding:14px 16px}
.said{font-size:15px;font-weight:500;margin:0 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;font-weight:500;border-radius:4px;padding:3px 8px;background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.assumed{font-size:12.5px;color:var(--mut);margin:10px 0 0}.assumed:empty{display:none}
.q{border:1px solid #f9dbaf;background:var(--amber-w);color:#7a2e0e;border-radius:8px;padding:12px 14px;margin:12px 0}.q p{margin:0 0 2px}.q .row{margin-top:8px}
.fail{border:1px solid #fecdca;background:var(--red-w);color:#912018;border-radius:8px;padding:12px 14px;margin:12px 0}
.empty{color:var(--mut);padding:28px 16px;text-align:center}

.setup{list-style:none;margin:0;padding:0}
.setup li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}.setup li:first-child{border-top:0}
.setup .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;border:1.5px solid var(--line2);color:var(--faint);background:#fff}
.setup .done .ic{background:var(--green);border-color:var(--green);color:#fff}.setup .now .ic{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px var(--blue-w)}
.setup b{font-weight:600;font-size:14px}.setup .todo b{color:var(--faint)}
.setup .body{font-size:13px;color:var(--mut);margin-top:2px}.setup .done .body{color:var(--green)}
.setup label{color:var(--ink2)}

.res-h{margin:26px 0 12px}.res-h h2{font-size:20px;font-weight:700}.res-h p{margin:4px 0 0;font-size:13px;color:var(--mut);max-width:72ch}
.opt .price{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:0;text-transform:none}
.opt .name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.opt .name span{font-size:11px}
.opt-meta{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mut)}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;margin:12px 0 0;padding:0}
.specs div{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.specs dt{color:var(--mut);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}.specs dd{margin:0;font-weight:500}
@media(max-width:640px){.specs{grid-template-columns:1fr}}
.why1{font-size:13px;color:var(--ink2);margin:12px 0 0}
.relaxed{margin:12px 0 0;padding:10px 12px;border-radius:6px;background:var(--amber-w);color:#7a2e0e;font-size:12.5px}.relaxed ul{margin:4px 0 0;padding-left:16px}
.opt-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:#fcfcfd}
.opt-foot .disc{display:flex;gap:16px;flex-wrap:wrap;margin-right:auto}
.dpanel{padding:4px 16px 14px;border-top:1px solid var(--line);font-size:13px}
details{font-size:13px}summary{cursor:pointer;color:var(--blue);font-weight:500;list-style:none}summary::-webkit-details-marker{display:none}summary:hover{text-decoration:underline;text-underline-offset:3px}
summary::after{content:" ▾";font-size:10px}details[open]>summary::after{content:" ▴"}
ul.why{margin:8px 0 0;padding-left:18px}ul.why.trade li{color:var(--mut)}
ul.checks{margin:8px 0 0;padding:0;list-style:none}ul.checks li{padding:2px 0}ul.checks li.bad{color:var(--red)}
.v-likely{color:var(--green)}.v-borderline{color:var(--amber)}.v-unlikely{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 0;border-top:1px solid var(--line);text-align:left;vertical-align:top}th{font-weight:600;color:var(--mut);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-top:0}
td+td,th+th{padding-left:12px}td.n,th.n{text-align:right;white-space:nowrap}tr.total td{font-weight:700;font-size:14px}
.ttl{font-size:12px;color:var(--mut);white-space:nowrap;margin-left:6px}.ttl.soon{color:var(--amber);font-weight:600}.opt-meta .ttl{margin-left:0;font-size:inherit}
.qttl{font-size:13px;margin:4px 0 0;color:var(--mut)}.qttl b{font-variant-numeric:tabular-nums;color:var(--ink)}.qttl.soon,.qttl.soon b{color:var(--amber)}
.rev{border-top:1px solid var(--line);padding:9px 0}.arklink{font-size:12px;white-space:nowrap;margin-left:6px}.arknote{margin:10px 0 0}.rev .stars{color:#f5a524;letter-spacing:1px}
.log{border-radius:6px;padding:6px 12px;margin-top:10px;max-height:220px;overflow:auto;font-size:12.5px;background:var(--bg);border:1px solid var(--line)}.log:empty{display:none}
.log div{padding:5px 0;border-bottom:1px solid var(--line)}.log div:last-child{border:0}.log .good{color:var(--green)}.log .bad{color:var(--red)}.log .pause{color:var(--amber)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;font-size:13px}.kv span:nth-child(odd){color:var(--mut)}
.skel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.skel i{display:block;height:10px;border-radius:5px;background:var(--bg);margin:10px 0;animation:shim 1.3s ease-in-out infinite}.skel i:first-child{width:40%;height:14px;margin-top:0}.skel i:nth-child(3){width:85%}.skel i:nth-child(4){width:60%}
@keyframes shim{50%{opacity:.4}}

.lines{list-style:none;margin:0;padding:0}
.lines li{display:grid;grid-template-columns:16px 1fr;gap:8px;padding:6px 0;line-height:1.45;font-size:13.5px}#agentPanel details{margin-top:8px}#agentPanel .kv{margin-top:10px}#agentPanel table{margin-top:10px}
.lines .ic{font-weight:700;text-align:center;font-size:12px}.lines .done .ic{color:var(--green)}.lines .now .ic{color:var(--blue);animation:blink 1.1s steps(2) infinite}.lines .bad .ic{color:var(--red)}.lines .todo{color:var(--faint)}
.proof{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fcfcfd;font-size:13px}.proof .lines{margin-top:4px}.proof.wait{display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:500}
.lines li.fresh{animation:pop .45s ease-out}@keyframes pop{from{opacity:0;transform:translateY(-4px)}}@keyframes blink{50%{opacity:.25}}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}.stat b{display:block;font-size:20px;font-weight:700}.stat span{font-size:12.5px;color:var(--mut)}
@media(max-width:640px){.stats{grid-template-columns:1fr}}
.day{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.lrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;color:var(--ink);text-decoration:none}
a.lrow:hover{border-color:var(--line2);text-decoration:none;box-shadow:0 1px 2px rgb(16 24 40 / .05)}
.lrow .dot{width:28px;height:28px;border-radius:6px;background:var(--blue-w);display:grid;place-items:center;flex:none}.lrow .dot::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue)}
.lrow .dot.ok{background:var(--green-w)}.lrow .dot.ok::after{background:var(--green)}.lrow .dot.no{background:var(--red-w)}.lrow .dot.no::after{background:var(--red)}.lrow .dot.ask{background:var(--amber-w)}.lrow .dot.ask::after{background:var(--amber)}.lrow .dot.mute{background:var(--bg)}.lrow .dot.mute::after{background:var(--faint)}
.lrow .main{min-width:0;flex:1}.lrow .main b{display:block;font-weight:600;font-size:13.5px}.lrow .main span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .amt{text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}.lrow .amt b{display:block;font-size:13.5px;color:var(--ink)}
.count-note{font-size:12.5px;color:var(--mut);margin-top:10px}

.otitle{display:flex;align-items:flex-start;gap:12px}.otitle .pill{margin-left:auto;margin-top:6px}
.ometa{font-size:12.5px;color:var(--mut);margin:2px 0 20px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.actions a.btnlike{display:inline-flex;align-items:center;font:600 13.5px var(--sans);padding:10px 14px;border-radius:6px;border:1px solid var(--line2);background:#fff;color:var(--ink2);text-decoration:none}.actions a.btnlike:hover{background:var(--bg)}
.box{border-radius:6px;padding:12px 14px}.box.ok{background:var(--green-w);color:var(--green)}

dialog{border:0;border-radius:12px;padding:0;max-width:560px;width:calc(100% - 32px);background:#fff;color:var(--ink);box-shadow:0 24px 64px rgb(16 24 40 / .22)}
dialog::backdrop{background:rgb(16 24 40 / .45)}dialog[open]{animation:rise .22s ease-out}@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.dlg{padding:22px 24px}.dlg h2{font-size:18px;font-weight:700}.dlg .x{float:right;background:none;border:0;color:var(--mut);font-size:22px;line-height:1;padding:2px 6px}.dlg .x:hover{background:var(--bg);color:var(--ink)}
.dlg table{margin-top:14px}
.dtotal{font-size:26px;font-weight:700;margin:16px 0 2px;letter-spacing:-.01em}.price-old{text-decoration:line-through;color:var(--faint);font-size:15px;font-weight:500;margin-left:8px}
.paycard{margin:16px 0 12px;border-radius:12px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,#1d2b53,#2f5be7);position:relative}
.paycard .chip-g{width:34px;height:24px;border-radius:5px;background:linear-gradient(180deg,#f3d27a,#c9a227);margin-bottom:14px}
.paycard .num{font:500 17px var(--mono);letter-spacing:.12em;margin:0 0 6px}.paycard .lb{font-size:12px;opacity:.75}
.paycard .stamp{position:absolute;top:14px;right:16px;font-size:11px;font-weight:700;border:1px solid rgb(255 255 255 / .6);border-radius:4px;padding:2px 7px}
.dlg .pay button{width:100%;padding:13px;font-size:14px}
dialog.cong{max-width:420px;overflow:visible;text-align:center}
.cg{position:relative;padding:34px 28px 26px}
.cg-ic{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--green-w);color:var(--green);display:grid;place-items:center;font-size:30px;font-weight:700;animation:cgpop .5s cubic-bezier(.2,1.6,.4,1)}
.cg h2{font-size:22px;font-weight:800;letter-spacing:-.02em}.cg p{margin:6px 0 0}
.cg-save{display:inline-block;margin:18px 0 6px;padding:10px 18px;border-radius:999px;background:var(--green-w);color:var(--green);font-size:24px;font-weight:800;letter-spacing:-.01em}
.cg-prices{font-size:14px;color:var(--mut)}.cg-prices s{color:var(--faint)}.cg-prices b{color:var(--ink)}
.cg button{width:100%;margin-top:22px;padding:13px;font-size:14px}
.burst{position:absolute;left:50%;top:66px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:8px;height:12px;border-radius:2px;background:var(--c);opacity:0;animation:cgfly .9s ease-out var(--d) forwards}
@keyframes cgpop{from{transform:scale(.4);opacity:0}}
@keyframes cgfly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(220deg);opacity:0}}
button.nego{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:12px;font-size:14px;background:var(--blue-w);color:var(--blue);border:1.5px dashed var(--blue)}button.nego:hover:not(:disabled){background:#e0e8fd;border-color:var(--blue-h);color:var(--blue-h)}button.nego:disabled{background:var(--blue-w);border-color:var(--blue-s);color:var(--blue);opacity:.8}
.nego-note{display:block;text-align:center;font-size:12px;color:var(--mut);margin-top:6px}
.nego-live{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;padding:12px;border-radius:6px;background:var(--blue-w);color:var(--blue);font-weight:600;font-size:13.5px}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.log.live{display:block;min-height:46px}.log .fresh{animation:pop .4s ease-out}

@media(max-width:780px){
  .app{display:flex;flex-direction:column}
  .side{display:contents}
  .side .logo{order:0;background:#fff;padding:14px 16px 6px}
  .nav{order:0;flex-direction:row;overflow-x:auto;background:#fff;padding:4px 12px 10px;border-bottom:1px solid var(--line);gap:4px}
  .nav a{white-space:nowrap;padding:7px 10px;font-size:13px}
  .work{order:1}.cards{order:3;padding:16px;margin:0}.side .reset{order:4;margin:0 0 24px 16px}
  .work-head{padding:12px 16px}.work-body{padding:20px 16px 40px}
  .title{font-size:22px}
}
@media(max-width:560px){.lnav{padding:16px}.who-mini span{display:none}.lhero{padding-top:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  catch (e) { document.body.innerHTML = `<main class="lhero"><h2 class="title">The servers aren't responding</h2><div class="fail">Run <span class="mono">npm start</span>, then reload this page. (${esc(e.message)})</div></main>`; return; }
  const P = location.pathname;
  if (["/build", "/order", "/orders", "/activity", "/audit"].includes(P) && !AUTH?.signedIn) return signIn(P + location.search);
  if (P === "/build") build(); else if (P === "/order") orderPage(); else if (P === "/orders") ordersPage(); else if (P === "/activity") activityPage(); else if (P === "/audit") auditPage(); else landing();
})();
