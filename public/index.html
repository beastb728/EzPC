<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC Build Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Same system as the technical dashboard: white canvas, hairlines. Colour only reports state: blue = fine, red = fails, amber = needs you. */
:root{--ink:#0d1017;--ink2:#262a33;--mut:#5f6470;--faint:#8d929c;--bg:#fff;--fog:#f6f7f9;--line:#e5e7eb;--line2:#d3d6dc;
--ok:#2456e8;--ok-w:#ebf0fe;--no:#d93a2b;--no-w:#fdeeec;--no-i:#ad271b;--ask:#b26f00;--ask-w:#fff5de;--ask-i:#7d4f06;
--sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--ink:#eceef2;--ink2:#d4d7dd;--mut:#a3a8b2;--faint:#7c818b;--bg:#0e1015;--fog:#15181e;--line:#252932;--line2:#323743;
--ok:#7a9bff;--ok-w:#18213a;--no:#ff7a6c;--no-w:#2d1715;--no-i:#ff9b90;--ask:#f0b44c;--ask-w:#2a2010;--ask-i:#f4c977}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
a{color:var(--ink);text-underline-offset:3px;text-decoration-color:var(--line2)}
.mono,.lbl{font-family:var(--mono)}.lbl{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}.mut{color:var(--mut)}.sm{font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1100px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:14px}
.brand{font-weight:600;white-space:nowrap}.tag{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);border-radius:4px;padding:4px 6px;color:var(--mut)}
.bar a.tech{margin-left:auto;font-size:13px}
.note{max-width:1100px;margin:0 auto;padding:10px 16px;font-size:12.5px;color:var(--ask-i);background:var(--ask-w);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 64px}
.steps{display:flex;gap:6px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.steps span{padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--faint)}.steps span.on{border-color:var(--ink);color:var(--ink)}.steps span.done{border-color:var(--ok);color:var(--ok)}
section{padding:24px 0;border-bottom:1px solid var(--line)}h2{font-size:18px;font-weight:600;margin:4px 0 12px}h3{font-size:15px;margin:0}
textarea{width:100%;font:15px/1.5 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:12px;min-height:84px;resize:vertical}
input[type=number]{font:15px var(--sans);padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink);width:160px}
button{font:500 14px/1 var(--sans);padding:10px 14px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}button.pick{background:transparent;color:var(--ink);border-color:var(--line2)}button.pick.sel{border-color:var(--ok);color:var(--ok);background:var(--ok-w)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.err{color:var(--no-i);font-size:13px;margin-top:8px;overflow-wrap:anywhere}.err:empty{display:none}
.q{border:1px solid color-mix(in srgb,var(--ask) 40%,transparent);background:var(--ask-w);border-radius:8px;padding:12px 14px;margin-top:10px}.q p{margin:0 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--mut)}
.builds{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{border:1px solid var(--line2);border-radius:10px;padding:16px;min-width:0}.card.sel{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.total{font:500 24px/1.2 var(--mono);margin:8px 0 2px}.charge{font-size:12.5px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}th{font-weight:500;color:var(--mut)}td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.v-likely{color:var(--ok)}.v-borderline{color:var(--ask)}.v-unlikely{color:var(--no-i)}
details{margin-top:10px;font-size:13px}summary{cursor:pointer;color:var(--mut)}ul.checks{margin:6px 0 0;padding-left:18px}ul.checks li.bad{color:var(--no-i)}
.box{border:1px solid var(--line2);border-radius:10px;padding:14px 16px;margin-top:10px}.box.ok{border-color:var(--ok);background:var(--ok-w)}
.demo{display:inline-block;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:4px 6px;background:var(--ask-w);color:var(--ask-i);border:1px solid color-mix(in srgb,var(--ask) 40%,transparent)}
ul.why{margin:6px 0 0;padding-left:18px;font-size:13px}ul.why.trade li{color:var(--mut)}
.rating{font-size:13px;margin-top:4px}.rev{border-top:1px solid var(--line);padding:6px 0;font-size:13px}
select{font:15px var(--sans);padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink)}
.log{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:12px;max-height:280px;overflow:auto;font-size:13px;background:var(--fog)}.log:empty{display:none}
.log div{padding:3px 0;border-bottom:1px solid var(--line)}.log div:last-child{border:0}.log .good{color:var(--ok)}.log .bad{color:var(--no-i)}.log .pause{color:var(--ask-i)}.log .t{font-family:var(--mono);color:var(--faint);font-size:11px;margin-right:8px}
.done-note{color:var(--ok);font-size:13.5px}
.steps a,.steps span{padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--faint);text-decoration:none}
.steps a{color:var(--mut)}.steps a:hover{border-color:var(--line2)}.steps .on{border-color:var(--ink);color:var(--ink)}.steps .done{border-color:var(--ok);color:var(--ok)}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 0 4px}.head h1{font-size:22px;font-weight:600;margin:0}
.back{font-size:13px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px}.back:hover{border-color:var(--line2);color:var(--ink)}
.lead{color:var(--mut);margin:6px 0 18px;max-width:760px}
.primary{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
.primary button{padding:12px 18px;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.field{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.field.need{border-color:var(--ask);background:var(--ask-w)}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}.field select,.field input{width:100%}
.field .hint{font-size:12px;color:var(--ask-i);margin-top:6px}
.stage{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.stage:last-child{border:0}
.dot2{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:12px;margin-top:1px}
.stage.done .dot2{border-color:var(--ok);background:var(--ok);color:var(--bg)}.stage.now .dot2{border-color:var(--ask);animation:pulse 1.2s infinite}.stage.bad .dot2{border-color:var(--no);background:var(--no);color:var(--bg)}
@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.stage.now .dot2{animation:none}}
.stage b{font-weight:500}.stage .sm{margin-top:2px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13px}.kv span:nth-child(odd){color:var(--mut)}
.fail{border:1px solid color-mix(in srgb,var(--no) 45%,transparent);background:var(--no-w);border-radius:10px;padding:14px 16px;margin-top:12px}
.empty{color:var(--mut);padding:24px 0}
.specs{font-size:13px;margin:8px 0 0;padding-left:0;list-style:none}.specs li{padding:2px 0}.specs span{color:var(--mut);display:inline-block;min-width:62px}
.price-old{text-decoration:line-through;color:var(--faint);font-size:15px;margin-left:8px}
input[type=text]{font:15px var(--sans);padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink)}
.top{max-width:1180px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:12px}
.top .brand{font-weight:600;font-size:17px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.top .who{font-size:13px;color:var(--ok)}
.link{background:none;border:0;color:var(--mut);padding:6px 8px;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.hero{max-width:860px;margin:0 auto;padding:56px 20px 40px;text-align:center}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ok)}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.04;letter-spacing:-.025em;margin:16px 0 18px;font-weight:600}
.hero p.sub{color:var(--mut);font-size:17px;margin:0 auto 30px;max-width:560px}
.promptbox{border:1px solid var(--line2);border-radius:18px;padding:16px;background:var(--bg);box-shadow:0 8px 30px color-mix(in srgb,var(--ink) 8%,transparent);text-align:left}
.promptbox textarea{border:0;padding:4px;min-height:96px;font-size:17px;background:transparent}.promptbox textarea:focus-visible{outline:0}
.promptbox .row{justify-content:flex-end;margin-top:6px}.promptbox button{border-radius:999px;padding:12px 20px}
.examples{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}.examples button{background:var(--fog);color:var(--ink2);border:1px solid var(--line);border-radius:999px;font-size:13px;padding:8px 12px;font-weight:400}
.fine{font-size:12.5px;color:var(--faint);margin-top:22px}
.layout{max-width:1180px;margin:0 auto;padding:18px 20px 64px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px}@media(max-width:900px){.layout{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--bg)}
.panel h2{font-size:16px;margin:0 0 8px}
.side .panel{position:sticky;top:12px}
.amount{font:500 22px/1.2 var(--mono)}.meter{height:6px;background:var(--fog);border-radius:9px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:var(--ok)}
.checklist{list-style:none;padding:0;margin:8px 0 0;font-size:14px}.checklist li{padding:5px 0;display:flex;gap:10px;align-items:baseline}.checklist .ic{width:16px;flex:none;text-align:center}
.checklist .done .ic{color:var(--ok)}.checklist .now .ic{color:var(--ask)}.checklist .bad .ic{color:var(--no)}.checklist .todo{color:var(--faint)}
.tag2{display:inline-block;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:3px 6px;background:var(--ask-w);color:var(--ask-i)}
.relaxed{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--ask-w);color:var(--ask-i);font-size:12.5px}.relaxed ul{margin:4px 0 0;padding-left:16px}
dialog{border:1px solid var(--line2);border-radius:16px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--bg);color:var(--ink)}dialog::backdrop{background:rgb(0 0 0 / .45)}
.dlg{padding:20px}.dlg h2{margin:0 0 4px;font-size:19px}.dlg .x{float:right;background:none;border:0;color:var(--mut);font-size:20px;padding:2px 6px}
.democard{margin:14px 0;border-radius:14px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,#2a3550,#3c4f86);font-family:var(--mono);position:relative}
.democard .num{font-size:18px;letter-spacing:.12em;margin:18px 0 10px}.democard .lb{font-size:10px;letter-spacing:.14em;opacity:.75}.democard .stamp{position:absolute;top:12px;right:14px;font-size:11px;border:1px solid #fff9;border-radius:4px;padding:2px 6px}
.textbtn{background:none;border:0;color:var(--ok);padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}
</style></head><body>
<script>
// PC Build Agent MVP: a landing page with the prompt and login (/), and a build page (/build) where you connect a wallet,
// approve one API allowance, and the agent runs and shows three PCs. Checkout and confirmation open in a dialog.
// The browser keeps only your words and the IDs it was given; payment, approval and order state always come from the backend.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const usd = (u) => `${(Number(u) / 1e6).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USDC`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const json = async (url, body) => { const r = await fetch(url, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error ?? `HTTP ${r.status}`), { status: r.status, body: j }); return j; };
const HS = "https://hashscan.io/testnet/transaction/";
const txLink = (t) => !t ? "-" : /^SIM/.test(t) ? `<span class="mono">${esc(t)}</span> <span class="mut">(simulated)</span>` : /^schedule:/.test(t) ? `<span class="mono">${esc(t)}</span>` : `<a class="mono" href="${HS}${encodeURIComponent(String(t).replace("@", "-").replace(/\.(\d+)$/, "-$1"))}" target="_blank" rel="noopener">${esc(t)}</a>`;
const EXAMPLES = ["Find me a gaming PC with a 4K monitor, within 4,000 USDC.", "A 1440p gaming PC for GTA 6 at 60 FPS, budget 1,500 USDC.", "Gaming and streaming PC with a keyboard and mouse, new parts only, 2,500 USDC."];

const KEY = "pc-mvp-v1";
let S = (() => { try { return JSON.parse(localStorage.getItem(KEY)) ?? {}; } catch { return {}; } })();
S = { text: "", answers: {}, search: null, order: null, quotes: {}, pending: null, ...S };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const reqKey = () => JSON.stringify([S.text.trim(), S.answers]);

let WAL = { mode: "simulated" }, STATUS = null, asset = { symbol: "USDC", decimals: 6 }, hpLoad = null, worldPop = null;
const units = (u) => `${(Number(u) / 10 ** asset.decimals).toFixed(asset.decimals > 6 ? 4 : 2)} ${asset.symbol}`;
const isHP = () => WAL.mode === "hashpack";
const worldLive = () => STATUS?.modes.world === "live";
const loadHP = () => hpLoad ??= new Promise((ok, no) => { const s = document.createElement("script"); s.src = "/hashpack.js"; s.onload = () => window.HashPack.init(WAL.projectId).then(ok, no); s.onerror = () => no(new Error("couldn't load the HashPack connector")); document.head.appendChild(s); }).catch((e) => { hpLoad = null; throw e; });
const hpAcct = () => { try { return window.HashPack?.account() ?? null; } catch { return null; } };
async function hpConnect() { await loadHP(); const a = hpAcct() || await window.HashPack.connect(WAL.projectId); if (a !== WAL.userId) throw new Error(`HashPack is connected to ${a}. Switch it to the demo wallet ${WAL.userId}.`); return a; }
async function hpSign(body) { const acc = await hpConnect(); const p = await json("/api/wallet/prepare", body); return window.HashPack.signAndExecute(acc, p.transaction); }
const popWorld = (href) => { if (!worldPop || worldPop.closed) worldPop = window.open("about:blank", "world-verify", "popup,width=460,height=720"); if (!worldPop) return false; if (href) { try { worldPop.opener = null; } catch {} worldPop.location.href = href; } return true; };
const closeWorld = () => { if (worldPop && !worldPop.closed) worldPop.close(); worldPop = null; };
let timers = [];
const later = (f, ms) => timers.push(setTimeout(f, ms));

// ---------- header: login with World ID, reset ----------
let LOGIN = null;
async function renderLogin() {
  const was = LOGIN?.loggedIn; LOGIN = await json("/api/login").catch(() => null); const box = $("login"); if (!box || !LOGIN) return;
  if (location.pathname === "/build" && LOGIN.loggedIn && !was && $("gLogin")) next();
  if (LOGIN.loggedIn) { box.innerHTML = `<span class="who">✓ ${LOGIN.mode === "live" ? "World ID verified" : "Logged in (simulated World ID)"}</span><button class="link" id="logout">Log out</button>`; $("logout").onclick = async () => { await json("/api/logout", {}); await renderLogin(); if (location.pathname === "/build") next(); }; return; }
  if (LOGIN.world) { box.innerHTML = `<span class="sm">Approve in World App: <a href="${esc(LOGIN.world.verificationUriComplete)}" target="_blank" rel="noopener">open</a>, code <b class="mono">${esc(LOGIN.world.userCode)}</b></span>`; later(renderLogin, 2000); return; }
  closeWorld();
  box.innerHTML = `${LOGIN.error ? `<span class="sm v-unlikely">${esc(LOGIN.error)}</span>` : ""}<button class="ghost" id="loginBtn">Log in with World ID</button>`;
  $("loginBtn").onclick = async () => { $("loginBtn").disabled = true; try { if (worldLive()) popWorld(); const l = await json("/api/login/world", {}); if (l.world?.verificationUriComplete) popWorld(l.world.verificationUriComplete); else closeWorld(); } catch (e) { closeWorld(); alert(e.message); } renderLogin(); };
}
async function resetDemo() {
  if (!confirm("Reset the demo? This revokes the allowance, logs out of World ID, and clears searches, orders and reviews records.")) return;
  try {
    const st = await json("/api/status").catch(() => null);
    if (isHP() && st?.wallet?.allowance && st.wallet.allowance !== "0") { await loadHP().catch(() => {}); if (hpAcct() === WAL.userId) await hpSign({ revoke: true }).catch((e) => alert(`Resetting, but the allowance is still set on Hedera (${e.message || e}). Revoke it in HashPack.`)); }
    await json("/api/reset", { forgetWorld: true });
  } catch (e) { alert(`Reset failed: ${e.message}`); }
  try { localStorage.removeItem(KEY); } catch {}
  location.href = "/";
}
const header = () => `<header class="bar"><div class="top"><a class="brand" href="/">⚡ PC Build Agent</a><span class="tag">pre-event prototype</span><div class="right"><span id="login"></span><button class="link" id="reset">Reset demo</button></div></div></header>`;

// ---------- Page 1: prompt and login ----------
function landing() {
  document.body.innerHTML = header() + `<main class="hero">
    <div class="eyebrow">Autonomous PC shopping, under your control</div>
    <h1>The PC agent that shops for you, and never oversteps.</h1>
    <p class="sub">Tell it what you play and what you can spend. It pays only for the recommendation data it needs, inside the allowance you approve.</p>
    <div class="promptbox"><textarea id="prompt" aria-label="Describe your PC" placeholder="${esc(EXAMPLES[0])}">${esc(S.text)}</textarea>
      <div class="row"><button id="build">Build my PC</button></div></div>
    <div class="examples">${EXAMPLES.map((e, i) => `<button data-ex="${i}">${esc(e)}</button>`).join("")}</div>
    <p class="fine">Learning prototype. Demo shops with sample stock; the PC is paid by a simulated card. Only the small recommendation fee is a real (testnet) x402 payment.</p></main>`;
  $("reset").onclick = resetDemo; renderLogin();
  const keep = () => { S.text = $("prompt").value; save(); };
  $("prompt").oninput = keep;
  document.querySelectorAll("[data-ex]").forEach((b) => b.onclick = () => { $("prompt").value = EXAMPLES[Number(b.dataset.ex)]; keep(); });
  // A new journey always starts from the login and a fresh wallet connection.
  $("build").onclick = () => { keep(); if (!S.text.trim()) { $("prompt").focus(); return; } if (S.search?.key !== reqKey()) { S.answers = {}; } S.newJourney = true; S.walletOk = false; save(); location.href = "/build"; };
}

// ---------- Page 2: wallet, allowance, agent, results ----------
function chips(q) {
  const t = q.target;
  return [q.budgetUnits && `PC budget ${usd(q.budgetUnits)}`, ...q.games.map((g) => g), ...q.workloads, t.resolution && `${t.resolution === "4K" ? (t.renderMode === "native" ? "native 4K" : "4K upscaled") : t.resolution}`, t.fps && `${t.fps} FPS`, q.monitor.needed && `${q.monitor.resolution ?? ""} monitor`, q.peripherals.keyboard && "keyboard", q.peripherals.mouse && "mouse", q.condition === "any" ? "used OK" : "new parts", q.regionText && `deliver to ${q.regionText}`, ...q.other].filter(Boolean).map((c) => `<span class="chip">${esc(c)}</span>`).join("");
}
let REQ = null, FEE = null;
async function build() {
  if (!S.text.trim()) { location.href = "/"; return; }
  document.body.innerHTML = header() + `<div class="layout"><main>
      <div class="panel"><div class="lbl">Your request</div><p style="margin:6px 0">${esc(S.text)}</p><div id="chips" class="chips"></div><div id="assumed" class="sm mut"></div><div id="clarify"></div><p class="sm"><a href="/">Edit request</a></p></div>
      <div class="panel" id="authPanel" hidden></div>
      <div class="panel" id="agentPanel" hidden><h2>Agent</h2><ul class="checklist" id="steps"></ul><div id="agentMsg"></div>

async function renderOrderBanner() {
  if (!S.order || !$("orderBanner")) return;
  const o = await json(`/api/pc/orders/${encodeURIComponent(S.order)}`).catch((e) => (e.status === 404 ? null : undefined));
  if (o === null) { S.order = null; save(); $("orderBanner").innerHTML = ""; return; }
  if (!o) return;
  $("orderBanner").innerHTML = `<div class="panel" style="border-color:var(--ok)"><span class="demo">demo order</span> <b>${esc(o.orderId)}</b>: ${esc(o.package.label)} from ${esc(o.shopName)}, ${usd(o.total)} · ${o.state === "delivered" ? "delivered (simulated)" : "confirmed"} <button class="textbtn" id="openOrder">Open</button></div>`;
  $("openOrder").onclick = () => { location.href = `/order?id=${encodeURIComponent(o.orderId)}`; };
}
// ---------- Page 3: the order (after "Pay with credit card — demo") ----------
// Everything here is read from the backend: the order, the paid recommendation it came from, and the audit trail.
async function orderPage() {
  const id = new URLSearchParams(location.search).get("id") ?? S.order;
  if (!id) { location.href = S.text ? "/build" : "/"; return; }
  document.body.innerHTML = header() + `<div class="layout"><main id="orderMain"><p class="empty">Loading your order…</p></main><aside class="side"><div class="panel" id="allowance"><div class="lbl">API spending allowance</div><p class="sm mut">Loading…</p></div></aside></div>`;
  $("reset").onclick = resetDemo; renderLogin(); refreshAllowance();
  let o; try { o = await json(`/api/pc/orders/${encodeURIComponent(id)}`); }
  catch (e) { $("orderMain").innerHTML = `<div class="fail">${e.status === 404 ? "There's no demo order with that reference (Reset demo clears orders)." : esc(e.message)}</div><div class="row"><a class="back" href="/">Start a new search</a></div>`; if (S.order === id && e.status === 404) { S.order = null; save(); } return; }
  S.order = o.orderId; save();
  const search = await json(`/api/pc/recommend/${o.requestId}`).catch(() => null);
  const pkg = search?.result?.packages?.find((p) => p.id === o.packageId);
  const lines = pkg ? [...pkg.components, ...pkg.peripherals] : [];
  const days = pkg ? Math.max(...lines.map((l) => l.deliveryDays)) : null, placed = new Date(o.createdAt);
  const eta = days ? new Date(placed.getTime() + days * 86400_000).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) : null;
  const saved = BigInt(o.listTotal) - BigInt(o.total);
  $("orderMain").innerHTML = `
    <div class="head" style="padding-top:4px"><h1>Your PC order</h1><span class="demo">demo order</span></div>
    <p class="lead">Order <b class="mono">${esc(o.orderId)}</b> · placed ${placed.toLocaleString()} · ${o.state === "delivered" ? "<b>Delivered (simulated)</b>" : "<b>Confirmed</b>, awaiting delivery"}</p>
    <div class="panel"><div class="lbl">PC package</div><h2 style="margin:6px 0 2px">${esc(o.package.label)} from ${esc(o.shopName)}</h2><div class="rating">${pkg ? ratingText(pkg.sellerRating) : ""}</div>
      ${lines.length ? `<table>${lines.map((l) => `<tr><td>${line(l)}${l.condition !== "new" ? ` <span class="v-borderline">(${esc(l.condition)}, ${l.warrantyMonths} mo)</span>` : ""}</td><td class="mut">${esc(l.category)}</td><td class="n">${usd(l.unitPrice)}</td></tr>`).join("")}</table>` : `<p class="sm">${esc(o.package.components.join(", "))}</p>`}
      ${pkg?.perf ? `<p class="sm mut" style="margin-top:8px">Sample estimate: <span class="v-${pkg.perf.verdict}">${esc(pkg.perf.verdict)}</span> to reach ${esc(pkg.perf.target)}. Not a benchmark.</p>` : ""}</div>
    <div class="panel"><div class="lbl">Delivery</div><div class="kv" style="margin-top:6px"><span>From</span><span>${esc(o.shopName)} (demo shop)</span><span>Estimated</span><span>${eta ? `${esc(eta)} (about ${days} days)` : "-"}</span><span>Status</span><span>${o.state === "delivered" ? `Delivered ${new Date(o.deliveredAt).toLocaleString()} (simulated)` : "On its way (simulated)"}</span></div>
      ${o.state === "delivered" ? "" : `<div class="row"><button class="ghost" id="deliver">Mark delivered (simulated)</button></div>`}</div>
    <div class="panel"><div class="lbl">Payment</div><table>
      ${saved > 0n ? `<tr><td>List price</td><td class="n">${usd(o.listTotal)}</td></tr><tr><td>Negotiated by your agent</td><td class="n">−${usd(saved)}</td></tr>` : ""}
      <tr><td>Card charged · ···· 4242 <span class="mut">(simulated, nothing charged)</span></td><td class="n">${usd(o.total)}</td></tr>
      <tr><td><b>Total charged</b></td><td class="n"><b>${usd(o.total)}</b></td></tr></table></div>
    <div class="panel"><div class="lbl">x402 recommendation-data payments</div>
      ${search?.status === "paid" ? `<p style="margin:8px 0 0">${units(search.amount)} to RigAdvisor · ${txLink(search.txId)}</p><p class="sm mut">Paid by your agent from the API allowance, separately from the PC. ${search.pullTx ? `Pulled from the allowance in ${txLink(search.pullTx)}.` : ""}</p>` : `<p class="sm mut">Not available.</p>`}</div>
    <div class="panel"><div class="lbl">Review the seller (optional)</div><div id="after" style="margin-top:6px"></div><p class="err" id="revErr"></p></div>
    <details class="panel" id="audit"><summary>Audit trail</summary><div id="auditBody" class="sm" style="margin-top:8px">Loading…</div></details>
    <div class="row"><a class="back" href="/build">Back to the options</a><button id="auditBtn">View audit trail</button></div>`;
  if ($("deliver")) $("deliver").onclick = async () => { $("deliver").disabled = true; await json(`/api/pc/orders/${o.orderId}/deliver`, {}).catch(() => {}); orderPage(); };
  if (o.state === "delivered") reviewBox(o); else $("after").innerHTML = `<p class="sm mut">Available once the order is delivered.</p>`;
  const loadAudit = async () => {
    const [a, b] = await Promise.all([json(`/api/pc/audit/${encodeURIComponent(o.requestId)}`).catch(() => []), json(`/api/pc/audit/${encodeURIComponent(o.orderId)}`).catch(() => [])]);
    const all = [...a, ...b].sort((x, y) => x.at - y.at);
    $("auditBody").innerHTML = `<p class="mut">Every Guard decision is also written to the public HCS topic${STATUS?.modes.audit === "live" ? "" : " (simulated here)"}. No card, name or address details are recorded.</p><table><tr><th>Time</th><th>Event</th><th>Detail</th><th>HCS</th></tr>${all.map((v) => `<tr><td class="mono">${new Date(v.at).toLocaleTimeString()}</td><td>${esc(v.event)}</td><td>${esc(v.detail)}</td><td class="mono">${esc(String(v.reference ?? "").slice(0, 22))}</td></tr>`).join("") || `<tr><td colspan="4" class="mut">No entries.</td></tr>`}</table>`;
  };
  $("audit").addEventListener("toggle", () => $("audit").open && loadAudit());
  $("auditBtn").onclick = () => { $("audit").open = true; $("audit").scrollIntoView({ behavior: "smooth" }); };
}
async function reviewBox(o) {
  if (!$("after")) return;
  let v; try { v = await json(`/api/pc/orders/${o.orderId}/review`); } catch (e) { $("revErr").textContent = e.message; return; }
  const intro = `<p class="sm mut">Optional. Labelled <span class="demo">demo-order review</span> because the purchase was simulated; World ID proves a verified human wrote it, not that it's true. Public on Arkiv for 90 days; one review per order.</p>`;
  if (v.review) { $("after").innerHTML = `<div class="box ok">Your ${v.review.rating}/5 review of ${esc(o.shopName)} is published${v.worldMode === "live" ? " with the ✓ World ID verified badge" : " (simulated World check)"}, until ${new Date(v.review.expiresAt).toLocaleDateString()}.</div>`; return; }
  if (!v.verified) {
    $("after").innerHTML = `<h3>Review the seller</h3>${intro}${v.world ? `<p class="sm">Approve in World App: <a href="${esc(v.world.verificationUriComplete)}" target="_blank" rel="noopener">open</a>, code <b class="mono">${esc(v.world.userCode)}</b>…</p>` : ""}${v.error ? `<p class="err">${esc(v.error)}</p>` : ""}<div class="row"><button id="revWorld">${v.world ? "Start again" : "Verify with World ID to review"}</button></div>`;
    $("revWorld").onclick = async () => { try { if (worldLive()) popWorld(); const w = await json(`/api/pc/orders/${o.orderId}/review/world`, {}); if (w.world?.verificationUriComplete) popWorld(w.world.verificationUriComplete); else closeWorld(); reviewBox(o); } catch (e) { closeWorld(); $("revErr").textContent = e.message; } };
    if (v.world) setTimeout(() => $("after") && reviewBox(o), 2500);
    return;
  }
  closeWorld();
  $("after").innerHTML = `<h3>Review the seller</h3>${intro}<div class="row"><select id="stars">${[5, 4, 3, 2, 1].map((n) => `<option value="${n}">${n} star${n > 1 ? "s" : ""}</option>`).join("")}</select></div><textarea id="revText" maxlength="280" placeholder="How did ${esc(o.shopName)} do? Public: no names, emails, links or phone numbers."></textarea><div class="row"><button id="revBtn">Publish review</button></div>`;
  $("revBtn").onclick = async () => { $("revBtn").disabled = true; $("revErr").textContent = ""; try { await json(`/api/pc/orders/${o.orderId}/review`, { rating: Number($("stars").value), text: $("revText").value }); reviewBox(o); } catch (e) { $("revErr").textContent = e.message; $("revBtn").disabled = false; } };
}

// ---------- start ----------
(async () => {
  try { [WAL, STATUS] = await Promise.all([json("/api/wallet"), json("/api/status")]); asset = STATUS.asset ?? asset; }
  catch (e) { document.body.innerHTML = `<div class="hero"><div class="fail">The servers aren't responding. Run <span class="mono">npm start</span>, then reload. (${esc(e.message)})</div></div>`; return; }
  if (location.pathname === "/build") build(); else if (location.pathname === "/order") orderPage(); else landing();
})();
</script></body></html>
